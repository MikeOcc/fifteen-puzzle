<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>15 Puzzle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>15 Puzzle</h1>

      <div class="stats">
        <span id="move-count">Moves: 0</span>
        <span id="timer">Time: 0s</span>
      </div>

      <div id="board" class="board"></div>

      <div id="solved-msg" class="solved-msg hidden">
        <h2>Solved!</h2>
        <p id="finish-stats"></p>
      </div>

      <div class="controls">
        <button id="new-game">New Game</button>
        <button id="reset">Reset</button>
        <button id="settings-btn">Settings</button>
      </div>
    </div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-card">
        <h2>Settings</h2>
        <div class="setting-row">
          <label for="color-bg">Background</label>
          <input type="color" id="color-bg">
        </div>
        <div class="setting-row">
          <label for="color-tile">Tile Color</label>
          <input type="color" id="color-tile">
        </div>
        <hr class="modal-divider">
        <div class="best-score-row">
          <span>Best Game</span>
          <span id="best-moves">—</span>
        </div>
        <div class="best-score-row">
          <span>Fastest Time</span>
          <span id="fastest-time">—</span>
        </div>
        <button id="settings-close">Close</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
